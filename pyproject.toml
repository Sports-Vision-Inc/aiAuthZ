[project]
name = "aiauthz"
version = "0.1.0"
description = "aiAuthZ by SportsVision AI — authentication and authorization gateway for AI agents"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "fakeredis>=2.23",
    "cryptography>=43.0",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pywavelets>=1.6",
    "pillow>=10.4",
    "qrcode>=7.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
aiauthz = "aiauthz.cli:app"
aiauthz-bootstrap = "scripts.bootstrap_dev:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiauthz*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
